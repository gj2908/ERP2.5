{% load static %}
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <!-- Brand Logo -->
    <a href="{% url 'student_profile' %}" class="brand-link">
      <img src="https://upload.wikimedia.org/wikipedia/en/f/fe/Srmseal.png" alt="SRMIST Logo" class="brand-image img-circle elevation-3"
           style="opacity: .8">
      <span class="brand-text font-weight-light">SRMIST Student</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Sidebar user panel -->
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <img src="{% static "dist/img/user2-160x160.jpg" %}" class="img-circle elevation-2" alt="User Image">
        </div>
        <div class="info">
          <a href="{% url 'student_profile' %}" class="d-block">{{ user.first_name }} {{ user.last_name }}</a>
          <small class="text-white">Student</small>
        </div>
      </div>

      <!-- Sidebar Menu -->
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="{% url 'student_view_attendance' %}" class="nav-link {% if request.path == student_view_attendance_url %} active {% endif %}">
              <i class="nav-icon fas fa-calendar-check"></i>
              <p>View Attendance</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="{% url 'student_feedback' %}" class="nav-link {% if request.path == student_feedback_url %} active {% endif %}">
              <i class="nav-icon fas fa-comment"></i>
              <p>Feedback</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="{% url 'student_notifications' %}" class="nav-link {% if request.path == student_notifications_url %} active {% endif %}">
              <i class="nav-icon fas fa-bell"></i>
              <p>
                Notifications
                <span id="notification-badge" class="badge badge-danger right" style="display: none;">0</span>
              </p>
            </a>
          </li>
          <li class="nav-item">
            <a href="{% url 'student_change_password' %}" class="nav-link {% if request.path == student_change_password_url %} active {% endif %}">
              <i class="nav-icon fas fa-key"></i>
              <p>Change Password</p>
            </a>
          </li>
        </ul>
      </nav>
      <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
  </aside>
