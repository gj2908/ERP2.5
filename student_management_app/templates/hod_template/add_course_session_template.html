{% extends 'hod_template/base_template.html' %}
{% block page_title %}
{% endblock page_title %}
{% block main_content %}
    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
          <div class="row">
              <div class="col-md-12">
                <!-- general form elements -->
                <div class="card card-primary">
                  <div class="card-header">
                    <h3 class="card-title">Add Course Session</h3>
                  </div>
                  <!-- /.card-header -->
                  <!-- form start -->
                  <form role="form" method="post" action="{% url 'add_course_session_save' %}">
                      {% csrf_token %}
                      <div class="card-body">
                          <div class="form-group">
                              <label>Course</label>
                              <select class="form-control" name="course" required>
                                  <option value="">Select Course</option>
                                  {% for course in courses %}
                                      <option value="{{ course.id }}">{{ course.course_name }}</option>
                                  {% endfor %}
                              </select>
                          </div>
                          <div class="form-group">
                              <label>Session Year</label>
                              <select class="form-control" name="session" required>
                                  <option value="">Select Session Year</option>
                                  {% for session in sessions %}
                                      <option value="{{ session.id }}">{{ session.start_year }} to {{ session.end_year }}</option>
                                  {% endfor %}
                              </select>
                          </div>
                      </div>
                      <!-- /.card-body -->
                      <div class="card-footer">
                        <button type="submit" class="btn btn-primary">Add Course Session</button>
                      </div>
                  </form>
                </div>
                <!-- /.card -->
              </div>
          </div>
      </div>
    </section>
    <!-- /.content -->
{% endblock main_content %}

{% block custom_js %}
<script>
$(document).ready(function(){
    {% if messages %}
        {% for message in messages %}
            $(document).Toasts('create', {
                class: '{% if message.tags %}bg-{{ message.tags }}{% else %}bg-info{% endif %}',
                title: 'Message',
                body: '{{ message }}'
            })
        {% endfor %}
    {% endif %}
});
</script>
{% endblock custom_js %}
