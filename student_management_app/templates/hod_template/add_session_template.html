{% extends 'hod_template/base_template.html' %}
{% block page_title %}
{% endblock page_title %}
{% block main_content %}
    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
          <div class="row">
              <div class="col-md-12">
                <!-- general form elements -->
                <div class="card card-primary">
                  <div class="card-header">
                    <h3 class="card-title">Add Session Year</h3>
                  </div>
                  <!-- /.card-header -->
                  <!-- form start -->
                  <form role="form" method="post" action="{% url 'add_session_save' %}">
                      {% csrf_token %}
                    <div class="card-body">
                      <div class="form-group">
                        <label>Session Start Year</label>
                        <input type="number" class="form-control" name="session_start" placeholder="Enter Session Start Year" min="2000" max="2099" required>
                      </div>
                      <div class="form-group">
                        <label>Session End Year</label>
                        <input type="number" class="form-control" name="session_end" placeholder="Enter Session End Year" min="2000" max="2099" required>
                      </div>
                    </div>
                    <!-- /.card-body -->

                    <div class="card-footer">
                      <button type="submit" class="btn btn-primary">Add Session</button>
                    </div>
                  </form>
                </div>
                <!-- /.card -->

              </div>
          </div>
      </div>
    </section>
    <!-- /.content -->
{% endblock main_content %}
